<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Bulanan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Rekapitulasi Bulanan</h1>
            <p>Ringkasan Keuangan dan Stok Barang</p>
            <a href="index.html" class="btn" style="display: inline-block; width: auto; margin-top: 15px; background-color: #7f8c8d; text-decoration: none;">Kembali ke Pencatatan</a>
        </header>

        <!-- Filter Bulan -->
        <div class="card" style="margin-bottom: 20px; text-align: center;">
            <label for="filter-bulan" style="display: inline-block; margin-right: 10px; font-size: 1.1rem; font-weight: bold;">Pilih Bulan:</label>
            <input type="month" id="filter-bulan" style="width: auto; display: inline-block; font-size: 1.1rem; padding: 5px 10px;">
        </div>

        <main class="grid-layout">
            <!-- Rekap Keuangan -->
            <section class="card">
                <h2>Total Keuangan</h2>
                <div style="font-size: 1.2rem; line-height: 2;">
                    <div style="display: flex; justify-content: space-between;">
                        <span>Total Pemasukan:</span>
                        <strong id="total-masuk" class="badge-masuk">Rp 0</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span>Total Pengeluaran:</span>
                        <strong id="total-keluar" class="badge-keluar">Rp 0</strong>
                    </div>
                    <hr style="margin: 15px 0; border: 1px solid #ecf0f1;">
                    <div style="display: flex; justify-content: space-between; font-size: 1.4rem;">
                        <span>Saldo Bersih:</span>
                        <strong id="saldo-bersih">Rp 0</strong>
                    </div>
                </div>
            </section>

            <!-- Rekap Barang -->
            <section class="card">
                <h2>Sisa Stok Barang</h2>
                <div class="table-container">
                    <table id="tabel-rekap-barang">
                        <thead>
                            <tr>
                                <th>Nama Barang</th>
                                <th>Masuk</th>
                                <th>Keluar</th>
                                <th>Sisa Stok</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data akan diisi oleh rekap.js -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Script utama Firebase untuk Halaman Rekap -->
    <script type="module" src="rekap.js"></script>
</body>
</html>
