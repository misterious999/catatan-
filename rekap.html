<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Keuangan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Rekapitulasi Bulanan</h1>
            <p>Ringkasan Arus Kas Anda</p>
            <a href="index.html" class="btn btn-outline">Kembali ke Pencatatan</a>
        </header>

        <main>
            <!-- Filter Bulan -->
            <div class="card glass" style="margin-bottom: 20px; text-align: center;">
                <label for="filter-bulan" style="display: inline-block; margin-right: 15px; font-size: 1.1rem;">Pilih Bulan:</label>
                <input type="month" id="filter-bulan" style="width: auto; display: inline-block; font-size: 1.1rem; padding: 8px 15px;">
            </div>

            <!-- Rekap Keuangan -->
            <section class="card glass">
                <h2>Total Keuangan Bulan Ini</h2>
                <div style="font-size: 1.3rem; line-height: 2.5; padding: 10px;">
                    <div style="display: flex; justify-content: space-between;">
                        <span>Total Pemasukan:</span>
                        <strong id="total-masuk" class="badge-masuk">Rp 0</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span>Total Pengeluaran:</span>
                        <strong id="total-keluar" class="badge-keluar">Rp 0</strong>
                    </div>
                    <hr style="margin: 20px 0; border: 1px solid rgba(255,255,255,0.1);">
                    <div style="display: flex; justify-content: space-between; font-size: 1.6rem; text-shadow: 0 0 10px rgba(255,255,255,0.2);">
                        <span>Saldo Bersih:</span>
                        <strong id="saldo-bersih">Rp 0</strong>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="rekap.js"></script>
</body>
</html>
