<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pencatatan Keuangan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Catatan Keuangan</h1>
            <p>Sistem Pencatatan Pemasukan & Pengeluaran</p>
            <a href="rekap.html" class="btn btn-outline">Lihat Rekap Bulanan</a>
        </header>

        <main>
            <section class="card glass">
                <h2>Form Pencatatan</h2>
                <form id="form-keuangan">
                    <div class="form-group">
                        <label>Tanggal</label>
                        <input type="date" id="tgl-uang" required>
                    </div>
                    <div class="form-group">
                        <label>Jenis</label>
                        <select id="jenis-uang" required>
                            <option value="Masuk">Pemasukan (Masuk)</option>
                            <option value="Keluar">Pengeluaran (Keluar)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Keterangan</label>
                        <input type="text" id="ket-uang" placeholder="Contoh: Gaji, Makan, Transport" required>
                    </div>
                    <div class="form-group">
                        <label>Nominal (Rp)</label>
                        <input type="number" id="nominal-uang" placeholder="0" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Simpan Data</button>
                </form>

                <div class="table-container">
                    <table id="tabel-keuangan">
                        <thead>
                            <tr>
                                <th>Tanggal</th>
                                <th>Keterangan</th>
                                <th>Jenis</th>
                                <th>Nominal</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data akan dimuat dari Firebase -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
